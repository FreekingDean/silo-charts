name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  charts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      # Lint, the combinations that have to keep rendering, the ones the
      # charts must refuse, and a schema check of every render.
      - name: Test charts
        run: ./ci/test-charts.sh

  # Installs each chart into a one-node minikube cluster and checks that Silo
  # comes up healthy. The silo chart gets a test-only PostgreSQL and Redis.
  install:
    runs-on: ubuntu-latest
    needs: charts
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        chart: [silo-omnibus, silo]
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - uses: medyagh/setup-minikube@latest
        with:
          cpus: max
          memory: max

      # The image is large; pull it into the cluster once, before any timeout
      # starts counting.
      - name: Pull Silo image
        run: minikube image pull ghcr.io/silo-server/silo-server:latest

      - name: Install and check ${{ matrix.chart }}
        run: ./ci/install-test.sh ${{ matrix.chart }}
