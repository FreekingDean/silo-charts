{{- if .Values.postgresql.enabled }}
{{- $component := "postgresql" }}
{{- $name := printf "%s-postgresql" (include "silo.fullname" .) }}
{{- $values := .Values.postgresql }}
{{- $pod := include "silo.mergePod" (dict "root" $ "base" (dict "terminationGracePeriodSeconds" 120) "pod" $values.pod) | fromYaml }}
{{- if not $values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.labels" (dict "root" $ "component" $component) | nindent 4 }}
  annotations:
    # Generated once. Deleting it with the data left behind locks Silo out.
    helm.sh/resource-policy: keep
type: Opaque
data:
  POSTGRES_PASSWORD: {{ include "silo.generated" (dict "root" $ "name" $name "key" "POSTGRES_PASSWORD" "length" 32) }}
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ $name }}
  selector:
    matchLabels:
      {{- include "silo.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- with $pod.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "silo.podLabels" (dict "root" $ "component" $component "pod" $pod) | nindent 8 }}
    spec:
      {{- with (include "silo.podSpec" $pod | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: postgresql
          {{- include "silo.serviceImage" $values.image | nindent 10 }}
          args:
            - postgres
            - -c
            - listen_addresses=*
            - -c
            - shared_preload_libraries=pg_stat_statements
          ports:
            - name: postgresql
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: silo
            - name: POSTGRES_DB
              value: silo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "silo.postgresqlSecretName" . }}
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "silo", "-d", "silo", "-h", "127.0.0.1"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "silo", "-d", "silo", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          {{- with $values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $pod.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # PostgreSQL 18 images keep the cluster under a versioned
            # directory below this, so a major upgrade can sit beside it.
            - name: data
              mountPath: /var/lib/postgresql
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ $values.shmSize }}
        {{- with $values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ . }}
        {{- end }}
  {{- if not $values.persistence.existingClaim }}
  volumeClaimTemplates:
    {{- include "silo.claimTemplate" $values.persistence | nindent 4 }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  selector:
    {{- include "silo.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
{{- end }}
