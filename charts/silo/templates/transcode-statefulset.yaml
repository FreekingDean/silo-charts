{{- if .Values.transcode.enabled }}
{{- $component := "transcode" }}
{{- if lt (int .Values.transcode.replicas) 1 }}
{{- fail "transcode.enabled needs transcode.replicas of at least 1" }}
{{- end }}
{{- if not (has .Values.transcode.sourceAccess (list "local" "core")) }}
{{- fail "transcode.sourceAccess is local or core" }}
{{- end }}
{{- $name := printf "%s-transcode" (include "silo.fullname" .) }}
{{- $grace := add (int .Values.transcode.drainTimeoutSeconds) 60 }}
{{- $base := mergeOverwrite (include "silo.spread" (dict "root" $ "component" $component) | fromYaml) (dict "terminationGracePeriodSeconds" $grace) }}
{{- $pod := include "silo.mergePod" (dict "root" $ "base" $base "pod" .Values.transcode.pod) | fromYaml }}
{{- $local := eq .Values.transcode.sourceAccess "local" }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.labels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  # Fixed by the number of keys: the API declares exactly these nodes.
  replicas: {{ .Values.transcode.replicas }}
  serviceName: {{ $name }}
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "silo.selectorLabels" (dict "root" $ "component" $component) | nindent 6 }}
  template:
    metadata:
      {{- with $pod.annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "silo.podLabels" (dict "root" $ "component" $component "pod" $pod) | nindent 8 }}
    spec:
      {{- with (include "silo.podSpec" $pod | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: silo
          image: {{ include "silo.image" . }}
          imagePullPolicy: {{ include "silo.imagePullPolicy" . }}
          command: ["silo"]
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          env:
            {{- include "silo.commonEnv" . | trim | nindent 12 }}
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: MODE
              value: transcode
            - name: SILO_CORE_URL
              value: {{ include "silo.coreUrl" . | quote }}
            - name: SILO_NODE_KEY_FILE
              value: /run/silo/transcode-keys/$(POD_INDEX)
            - name: SILO_NODE_NAME
              value: $(POD_NAME)
            - name: SILO_NODE_URL
              value: {{ printf "http://$(POD_NAME).%s:%v" (include "silo.svcHost" (dict "root" . "name" $name)) .Values.ports.http | quote }}
            - name: SILO_NODE_SOURCE_ACCESS
              value: {{ .Values.transcode.sourceAccess | quote }}
            - name: SILO_NODE_MAX_TRANSCODES
              value: {{ .Values.transcode.maxTranscodes | quote }}
            {{- with .Values.transcode.group }}
            - name: SILO_NODE_GROUP
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.transcode.hwAccel }}
            - name: SILO_NODE_HW_ACCEL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.transcode.hwDevice }}
            - name: SILO_NODE_HW_DEVICE
              value: {{ . | quote }}
            {{- end }}
            - name: SILO_NODE_DRAIN_TIMEOUT
              value: {{ printf "%ds" (int .Values.transcode.drainTimeoutSeconds) | quote }}
          # Both probes stay on /api/v1/health, which answers 200 while the
          # node drains, so a draining node is not restarted.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.transcode.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $pod.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: state
              mountPath: /config/silo
            - name: transcode
              mountPath: /tmp/silo-transcode
            - name: keys
              mountPath: /run/silo/transcode-keys
              readOnly: true
            {{- if $local }}
            {{- include "silo.mediaVolumeMount" . | nindent 12 }}
            {{- end }}
      volumes:
        - name: state
          emptyDir: {}
        - name: transcode
          {{- include "silo.scratchVolume" .Values.transcode.scratch | trim | nindent 10 }}
        - name: keys
          secret:
            secretName: {{ include "silo.transcodeKeysSecretName" . }}
            defaultMode: 0440
        {{- if $local }}
        {{- include "silo.mediaVolume" . | nindent 8 }}
        {{- end }}
---
# The API reaches each node at its own name, and keeps reaching a draining
# node, which is why not-ready addresses are published.
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "silo.serviceLabels" (dict "root" $ "component" $component) | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "silo.selectorLabels" (dict "root" $ "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "silo.fullname" . }}-transcode-nodes
  labels:
    {{- include "silo.labels" (dict "root" $ "component" $component) | nindent 4 }}
data:
  transcode-nodes.yaml: |
    {{- include "silo.transcodeNodesDocument" . | nindent 4 }}
{{- end }}
