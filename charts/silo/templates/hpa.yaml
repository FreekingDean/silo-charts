{{- $workloads := list
  (dict "component" "api" "kind" "Deployment" "name" "" "enabled" true "values" .Values.api)
  (dict "component" "proxy" "kind" "StatefulSet" "name" "-proxy" "enabled" .Values.proxy.enabled "values" .Values.proxy) }}
{{- range $workloads }}
{{- $autoscaling := .values.autoscaling }}
{{- if and .enabled $autoscaling.enabled }}
{{- if not (dig "requests" "cpu" "" (.values.resources | default dict)) }}
{{- fail (printf "%s.autoscaling needs %s.resources.requests.cpu: cpu utilization is measured against the request" .component .component) }}
{{- end }}
{{- if gt (int $autoscaling.minReplicas) (int $autoscaling.maxReplicas) }}
{{- fail (printf "%s.autoscaling.minReplicas is above maxReplicas" .component) }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "silo.fullname" $ }}{{ .name }}
  labels:
    {{- include "silo.labels" (dict "root" $ "component" .component) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: {{ .kind }}
    name: {{ include "silo.fullname" $ }}{{ .name }}
  minReplicas: {{ $autoscaling.minReplicas }}
  maxReplicas: {{ $autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $autoscaling.targetCPUUtilizationPercentage }}
  {{- with $autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
