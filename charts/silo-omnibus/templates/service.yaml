apiVersion: v1
kind: Service
metadata:
  name: {{ include "silo-omnibus.fullname" . }}
  labels:
    {{- include "silo-omnibus.serviceLabels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- with .Values.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  {{- with .Values.service.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "silo-omnibus.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
    - name: jellyfin
      port: {{ .Values.ports.jellyfin }}
      targetPort: jellyfin
    - name: abs
      port: {{ .Values.ports.audiobookshelf }}
      targetPort: abs
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    {{- end }}
